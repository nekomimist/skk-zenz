name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  dist:
    uses: ./.github/workflows/dist.yml

  publish:
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true
      # The archives are named after the Version header of skk-zenz.el, so
      # this also checks that the tag matches it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=()
          for arch in amd64 arm64; do
            name="artifacts/zenz-server-${GITHUB_REF_NAME}-linux-${arch}.tar.gz"
            if [ ! -f "$name" ] || [ ! -f "$name.sha256" ]; then
              echo "missing $name or its .sha256; does the tag match the Version header?" >&2
              ls artifacts >&2
              exit 1
            fi
            files+=("$name" "$name.sha256")
          done
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${files[@]}"
