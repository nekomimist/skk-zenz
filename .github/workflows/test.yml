name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Ubuntu 24.04 ships Emacs 29.
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ make emacs-nox
      - name: Model cache key
        id: model
        run: echo "sha256=$(sed -n 's/^MODEL_SHA256 ?= //p' Makefile)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: models
          key: zenz-model-${{ steps.model.outputs.sha256 }}
      - run: make model
      - run: make test

  dist:
    uses: ./.github/workflows/dist.yml
